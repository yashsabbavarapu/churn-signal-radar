[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-radar"
version = "0.1.0"
description = "Explainable churn-risk scoring from product usage and support signals"
requires-python = ">=3.11"

[project.scripts]
churn-radar = "churn_radar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
